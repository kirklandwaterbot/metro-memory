name: OSM Probe

# Snapshots the rail network of each area in data-sources/probes/requests/
# (operating, under-construction and proposed lines and stations) from
# OpenStreetMap and pushes the compact results to the `osm-probes` branch,
# so city data can be checked offline. Data © OpenStreetMap contributors (ODbL).

on:
  push:
    paths:
      - 'data-sources/probes/requests/**'
      - 'scripts/cities/osm-probe.js'
      - '.github/workflows/osm-probe.yml'

permissions:
  contents: write

concurrency:
  group: osm-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Fetch previous results
        run: |
          mkdir -p /tmp/probes
          if git fetch --depth 1 origin osm-probes 2>/dev/null; then
            git --work-tree=/tmp/probes checkout FETCH_HEAD -- . 2>/dev/null || true
            git reset -q
          fi
          ls -la /tmp/probes

      - name: Probe (pushing after each area, so a slow area can't lose the others)
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          push() {
            (
              cd /tmp/probes
              rm -rf .git
              git init -q -b osm-probes
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              printf 'OSM probe snapshots written by scripts/cities/osm-probe.js.\n\nData © OpenStreetMap contributors, ODbL.\n' > README.md
              printf '{"git":{"deploymentEnabled":false}}\n' > vercel.json
              git add -A
              git commit -q -m "OSM probe snapshots ($(date -u +%F))"
              git push -q -f "$PUSH_URL" osm-probes
            )
          }
          failed=0
          for f in data-sources/probes/requests/*.json; do
            slug=$(basename "$f" .json)
            before=$(md5sum "/tmp/probes/$slug.json" 2>/dev/null || true)
            if ! node scripts/cities/osm-probe.js --out=/tmp/probes --only="$slug"; then
              echo "::warning::$slug probe failed"; failed=1; continue
            fi
            after=$(md5sum "/tmp/probes/$slug.json" 2>/dev/null || true)
            if [ "$before" != "$after" ]; then push; fi
          done
          exit $failed
