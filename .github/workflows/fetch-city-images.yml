name: Fetch City Images

# Downloads the city photos and icons listed in data-sources/city-images.json
# from Wikimedia Commons (the dev workspace can't reach it) and commits them.

on:
  push:
    paths:
      - 'data-sources/city-images.json'
      - 'scripts/cities/fetch_city_images.py'
      - '.github/workflows/fetch-city-images.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/cities/fetch_city_images.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images src/lib/cityAssetManifest.json
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -q -m "Add city images from Wikimedia Commons" -m "See public/images/CREDITS.md for authors and licences."
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
